<template>

    <lightning-card icon-name={iconName}>
        <div slot="title" class="slds-grid slds-grid_vertical-align-center">
            {title}
            <template if:true={titleHelpText}>
                <lightning-helptext class="slds-var-m-left_xx-small" icon-name="utility:info_alt" content={titleHelpText} >
                </lightning-helptext>
            </template>
        </div>

        <div slot="actions">
            <c-data-cloud-query-action-bar
                action-config={actionConfig}
                selected-records={selectedRows}
                record-id={recordId}
                onrefresh={refreshData}>
            </c-data-cloud-query-action-bar>
        </div>

        <div class="slds-m-around_medium">
            <template if:true={subtitle}>
                <div class="slds-text-body_small slds-hyphenate slds-var-m-bottom_small">
                    {subtitle}
                </div>
            </template>

            <template if:true={isLoading}>

                <lightning-spinner alternative-text="Loading..." variant="brand"></lightning-spinner>
            </template>

            <template if:true={error}>
                <div class="slds-theme_error" role="alert">
                    <lightning-accordion allow-multiple-sections-open="true">
                        <lightning-accordion-section class="error-detail-section" label={genericErrorMessage}>
                            {error}
                        </lightning-accordion-section>
                    </lightning-accordion>
                </div>
            </template>

            <template if:false={error}>
                <template if:true={data.length}>
                    <lightning-datatable render-mode="default" key-field="_key" data={data} columns={columns}
                        onnavigatetodatacloudrecord={handleDataCloudRecordClick}
                        show-row-number-column
                        hide-checkbox-column={hasNoActionConfig}
                        onrowselection={handleRowSelection}>
                        <c-data-cloud-query-result-list-custom-data-types-provider
                            slot="customdatatypes"></c-data-cloud-query-result-list-custom-data-types-provider>
                    </lightning-datatable>

                    <div class="slds-align_absolute-center">
                        <template if:true={data.length}>
                            {showRecordCount}
                        </template>
                        <template if:true={showViewMoreButton}>
                            &nbsp;<lightning-button label={loadMoreButtonLabel} variant="base" onclick={handleViewMore}>
                            </lightning-button>
                        </template>
                    </div>

                </template>
                <template if:false={data.length}>
                    <p class="slds-text-align_center">{noDataMessage}</p>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
