<template>
    <div class="table-cell slds-grid slds-grid_vertical-align-center" onclick={togglePopover} title={value}>
        <!--<template if:true={showPopoverButton}>
            <lightning-icon icon-name="utility:info_alt" size="x-small" alternative-text="Show Details"
                title="Show Details" variant="success" class="popper-reference-element"></lightning-icon>
        </template>-->
        &nbsp;
        <lightning-formatted-text class="cell-text popper-reference-element" value={value}></lightning-formatted-text>
        <!-- <span class="slds-truncate" title={value}>{value}</span>-->
    </div>

    <template if:true={isPopoverOpen}>
        <div class="slds-popover slds-popover_large slds-nubbin_top popper-element" style={popoverStyle} role="dialog"
            aria-modal="true" data-popper-placement="bottom">
            <div class="slds-popover__header slds-grid slds-grid_align-spread slds-p-around_small">
                <div class="slds-text-heading_small slds-truncate">
                    <lightning-icon icon-name={popoverIcon} alternative-text="Icon" size="small"
                        class="slds-m-right_x-small"></lightning-icon>
                    {popoverTitle}
                </div>
                <lightning-button-icon icon-name="utility:close" alternative-text="Close" variant="bare" title="Close"
                    onclick={togglePopover}></lightning-button-icon>
            </div>

            <div class="slds-popover__body slds-scrollable_y" style={popoverContentStyle}>
                <lightning-layout multiple-rows="true" vertical-align="stretch">
                    <template for:each={popoverItems} for:item="item">
                        <lightning-layout-item flexibility="auto" key={item.label} size="6" padding="around-small">

                            <div class="slds-form-element slds-form-element_stacked slds-form-element_readonly slds-height_full slds-grid slds-grid_vertical">
                                <span class="slds-form-element__label">{item.label}</span>
                                <div class="item-container slds-form-element__control slds-col">
                                    <template if:true={item.isRichText}>
                                        <lightning-formatted-rich-text
                                            value={item.value}></lightning-formatted-rich-text>
                                    </template>
                                    <template if:true={item.isNumber}>
                                        <lightning-formatted-number title={item.value} value={item.value}
                                            format-style="decimal">
                                        </lightning-formatted-number>
                                    </template>
                                    <template if:true={item.isCurrency}>
                                        <lightning-formatted-number title={item.value} value={item.value}
                                            format-style="currency" currency-code={item.typeAttributes.currencyCode}
                                            minimum-fraction-digits={item.typeAttributes.minimumFractionDigits}>
                                        </lightning-formatted-number>
                                    </template>
                                    <template if:true={item.isDate}>
                                        <lightning-formatted-date-time title={item.value} value={item.value}
                                            year={item.typeAttributes.year} month={item.typeAttributes.month}
                                            day={item.typeAttributes.day}>
                                        </lightning-formatted-date-time>
                                    </template>
                                    <template if:true={item.isDateTime}>
                                        <lightning-formatted-date-time title={item.value} value={item.value}
                                            year={item.typeAttributes.year} month={item.typeAttributes.month}
                                            day={item.typeAttributes.day} hour={item.typeAttributes.hour}
                                            minute={item.typeAttributes.minute} second={item.typeAttributes.second}>
                                        </lightning-formatted-date-time>
                                    </template>
                                    <template if:true={item.isDefault}>
                                        <lightning-formatted-text title={item.value}
                                            value={item.value}></lightning-formatted-text>
                                    </template>
                                </div>
                            </div>
                        </lightning-layout-item>
                    </template>
                </lightning-layout>
            </div>
        </div>
    </template>
</template>
