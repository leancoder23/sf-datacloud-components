<template>
    <lightning-card  icon-name="standard:chart">
        <div slot="title" class="slds-grid slds-grid_vertical-align-center">
            {chartTitle}
            <template if:true={chartHelpText}>
                <lightning-helptext class="slds-var-m-left_xx-small" icon-name="utility:info_alt" content={chartHelpText} >
                </lightning-helptext>
            </template>
        </div>
        <div slot="actions">
            <lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh Data" onclick={handleRefresh}>
            </lightning-button-icon>
        </div>
        <div class="slds-p-around_medium">
            <template if:true={chartSubtitle}>
                <div class="slds-text-body_small slds-hyphenate slds-var-m-bottom_small">
                    {chartSubtitle}
                </div>
            </template>
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading chart data..." size="medium" variant="brand"></lightning-spinner>
            </template>
            <template if:true={error}>
                <div class="slds-theme_error" role="alert">
                    <lightning-accordion allow-multiple-sections-open="true">
                        <lightning-accordion-section class="error-detail-section" label={genericErrorMessage}>
                            {error}
                        </lightning-accordion-section>
                    </lightning-accordion>
                </div>
            </template>
            <template if:false={error}>
                <template lwc:if={showNoDataMessage}>
                    <div class="slds-text-align_center">{noDataMessage}</div>
                </template>
                <template lwc:else>
                    <div class="chart-container" style={chartContainerStyle}>
                        <canvas class="chart" lwc:dom="manual"></canvas>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>

</template>
